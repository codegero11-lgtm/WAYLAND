controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      joints:
        - leg1_coxa_joint
        - leg1_femur_joint
        - leg1_tibia_joint
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      joints:
        - leg1_coxa_joint
        - leg1_femur_joint
        - leg1_tibia_joint
      state_publish_rate: 25
      action_monitor_rate: 10
      allow_partial_joints_goal: false
      constraints:
        goal_time: 0.5
        stopped_velocity_tolerance: 0.05
        leg1_coxa_joint:
          trajectory: 0.5
          goal: 0.5
        leg1_femur_joint:
          trajectory: 0.5
          goal: 0.5
        leg1_tibia_joint:
          trajectory: 0.5
          goal: 0.5
